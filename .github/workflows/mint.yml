name: MiNT
on:
  push:
    branches: [ mint-1.47 ]
    tags: [ 'v*-mint' ]
  pull_request:
    branches: [ mint-1.47 ]
  workflow_dispatch:
env:
  DEF_CFLAGS: -O2 -fomit-frame-pointer -Wall
  PACKAGENAME: e2fsprogs
  CROSS_TOOL: m68k-atari-mint

jobs:
  mint-build:
    name: Cross-compile for MiNT (${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - { cpu: '000', cflags: -m68000 }
        - { cpu: '020', cflags: -m68020-60 }
        - { cpu: 'v4e', cflags: -mcpu=5475 }
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install packages
      run: |
        SYSROOT_DIR="/" ./.scripts/install-freemint.sh binutils gcc mintbin
        ./.scripts/install-freemint.sh mintlib fdlibm
    - name: build
      run: |
        ./configure --host=$CROSS_TOOL --prefix=/usr --sysconfdir=/etc --sbindir=/sbin --disable-nls --without-pthread CFLAGS="${{ matrix.cflags }} $DEF_CFLAGS" LDFLAGS="${{ matrix.cflags }} -s"
        make -j$(nproc) install-strip V=1 DESTDIR=$PWD/installdir
        if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION=${GITHUB_REF_NAME#v}; VERSION=${VERSION%-mint}; else VERSION=git-${GITHUB_SHA::7}; fi
        cd installdir
        rm -rf usr/lib
        rm -rf usr/share/info
        rm -rf usr/share/ss
        rm -rf usr/share/et
        rm -f sbin/e2label
        rm -f sbin/findfs
        rm -f sbin/e2mmpstatus
        rm -f sbin/mkfs.ext2
        rm -f sbin/mkfs.ext3
        rm -f sbin/mkfs.ext4
        rm -f sbin/fsck.ext2
        rm -f sbin/fsck.ext3
        rm -f sbin/fsck.ext4
        ln -s tune2fs sbin/e2label
        ln -s tune2fs sbin/findfs
        ln -s mke2fs sbin/mkfs.ext2
        ln -s mke2fs sbin/mkfs.ext3
        ln -s mke2fs sbin/mkfs.ext4
        ln -s e2fsck sbin/fsck.ext2
        ln -s e2fsck sbin/fsck.ext3
        ln -s e2fsck sbin/fsck.ext4
        ln -s dumpe2fs sbin/e2mmpstatus
        rm -f usr/share/man/man5/ext3.5
        rm -f usr/share/man/man5/ext4.5
        rm -f usr/share/man/man8/e2label.8
        rm -f usr/share/man/man8/mkfs.ext2.8
        rm -f usr/share/man/man8/mkfs.ext3.8
        rm -f usr/share/man/man8/mkfs.ext4.8
        rm -f usr/share/man/man8/fsck.ext2.8
        rm -f usr/share/man/man8/fsck.ext3.8
        rm -f usr/share/man/man8/fsck.ext4.8
        gzip -9 usr/share/man/*/*
        ln -s ext2.5.gz usr/share/man/man5/ext3.5.gz
        ln -s ext2.5.gz usr/share/man/man5/ext4.5.gz
        ln -s tune2fs.8.gz usr/share/man/man8/e2label.8.gz
        ln -s mke2fs.8.gz usr/share/man/man8/mkfs.ext2.8.gz
        ln -s mke2fs.8.gz usr/share/man/man8/mkfs.ext3.8.gz
        ln -s mke2fs.8.gz usr/share/man/man8/mkfs.ext4.8.gz
        ln -s e2fsck.8.gz usr/share/man/man8/fsck.ext2.8.gz
        ln -s e2fsck.8.gz usr/share/man/man8/fsck.ext3.8.gz
        ln -s e2fsck.8.gz usr/share/man/man8/fsck.ext4.8.gz
        tar --owner=0 --group=0 -cjvf ../$PACKAGENAME-$VERSION-mint${{ matrix.cpu }}.tar.bz2 *
    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-logs-${{ matrix.cpu }}
        path: config.log
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}-mint${{ matrix.cpu }}
        path: ${{ env.PACKAGENAME }}-*.tar.bz2

  # A tag gets its archives attached to the release of that name, which is
  # created as a draft if there is none yet
  release:
    if: github.ref_type == 'tag'
    needs: mint-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true
    - name: Attach archives
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1
        then
          gh release upload "$GITHUB_REF_NAME" $PACKAGENAME-*.tar.bz2 --clobber
        else
          gh release create "$GITHUB_REF_NAME" $PACKAGENAME-*.tar.bz2 --draft --verify-tag --title "$PACKAGENAME ${GITHUB_REF_NAME#v}" --notes ""
        fi
